name: kernel

on:
  push:
    branches: [main]
  pull_request:

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      # Gate 1: the frozen reference artifact is byte-identical to every alias
      # and to the sources embedded in the standalones.
      - name: reference-integrity
        working-directory: packages/cortex-kernel
        run: node --test test/reference.test.mjs

      # Gate 2: the oracle golden corpus still matches the frozen source
      # (fixtures + manifest hashes + deterministic double-build).
      - name: oracle-check
        run: node test/oracle/harness.mjs --check

      # Gate 3: extracted-kernel unit tests (registry integrity, compatibility,
      # planner metamorphic properties, contracts/obligations, cascade,
      # serialization, trace invariance, no-browser/no-network source scan).
      - name: kernel-unit
        working-directory: packages/cortex-kernel
        run: npm test

      # Gate 4 (critical): the extracted kernel reproduces every manifest hash.
      # Fails on fixture/hash mismatch, array reordering, semantic-invariant
      # regression, a missing case, an unexpected output field, or nondeterminism.
      - name: kernel-golden
        working-directory: packages/cortex-kernel
        run: npm run kernel:golden -- --check

      # Gate 5: the differential comparator + the hard trace-invariance proof
      # (enabling trace never changes the canonical decision hash).
      - name: kernel-differential
        working-directory: packages/cortex-kernel
        run: node --test test/trace-invariance.test.mjs

      # Gate 6: the packed ESM artifact imports cleanly in a fresh process.
      - name: package-smoke
        working-directory: packages/cortex-kernel
        run: npm run pack:smoke

      # Gate 7: repeated invocation is bit-stable (oracle + kernel golden both
      # re-verified; each performs its own deterministic double-build).
      - name: determinism
        run: |
          node test/oracle/harness.mjs --check
          node packages/cortex-kernel/test/golden.mjs --check

      # Gate 8: the committed behavioral certificate still describes this
      # repository — an oracle or canonicalizer change that was not
      # re-certified fails here rather than shipping a stale claim.
      - name: certification
        run: npm run certify:check

      # Gate 9: generated inputs, not just the 41 pinned points. Runs the frozen
      # oracle and the extracted kernel over a seeded sweep of the input space
      # and compares canonical decision hashes. Divergence is reported as a
      # field-level diff with a reproducing seed.
      - name: differential-fuzz
        run: npm run fuzz

      # Gate 10: cross-language conformance. Every registered implementation
      # must reproduce the corpus hashes it declares support for. This is what
      # keeps the contract portable rather than a JavaScript artifact.
      - name: conformance
        run: |
          npm run conformance:build
          npm run conformance

      # Gate 11: the certification chain is intact — links unbroken,
      # certificates unaltered since certification, and the head entry still
      # describes the current corpus. A behavioral change without a ledger
      # entry fails here.
      - name: ledger
        run: npm run ledger:verify

      # Gate 12: the unverified surface did not grow. New unverified behavior
      # must be a deliberate, regenerated decision rather than a silent drift.
      - name: frontier-map
        run: npm run frontier:check

      # Gate 13: the dependency-free claim is an enforced invariant, not a
      # lock-file convention. A new crate or npm package fails here unless the
      # policy is changed in the same commit.
      - name: dependency-policy
        run: npm run deps:policy

      # Gate 14: canonicalization is shared infrastructure across languages, so
      # the encoding itself is pinned by adversarial vectors — absent vs null vs
      # undefined, -0, Unicode key order, array-order preservation, transient-id
      # replacement, timestamp exclusion. Drift here invalidates every hash in
      # every implementation, so it is a canonicalizationVersion event.
      - name: canonicalization-vectors
        run: npm run vectors

      # Gate 15: documentation cannot drift from the workflow. The gate set has
      # grown three times, each time leaving a stale count or table behind; the
      # workflow is the source of truth and every other inventory must match.
      - name: gate-inventory
        run: npm run gates

      # Gate 16: the corpus must be DISCRIMINATING, not merely agreed-with. A
      # green conformance run proves one implementation matches the fixtures;
      # it says nothing about whether the fixtures reach the boundaries they
      # claim to pin. This gate mutates one semantic boundary at a time in the
      # Rust peer and requires the named corpus case to catch each, with the
      # predicted violation observable in the mutant's own output — a hash
      # mismatch alone is not a kill. It fails when a mutant survives (a corpus
      # defect), is killed incidentally, becomes equivalent or expires, is
      # never executed, loses its pinning fixture, or when the committed
      # MUTATION-REPORT.json is stale. The classifier is itself tested first,
      # against synthetic mutants of every outcome, so it cannot silently
      # degrade to "the hash changed" while still reporting 10/10.
      - name: mutation-battery
        run: npm run mutants:check
