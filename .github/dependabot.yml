version: 2
updates:
  # Workflow actions are pinned to immutable commit SHAs (see
  # .github/workflows/ci.yml). Dependabot rewrites the SHA and its trailing
  # version comment together, so upgrades arrive as reviewable PRs instead of
  # a floating tag silently moving the workflow dependency.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: ci
    labels:
      - dependencies
      - github-actions
